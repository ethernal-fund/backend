services:
  - type: web
    name: ethernal-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      - key: CORS_ORIGINS
        value: "https://ethernal.fund,https://www.ethernal.fund,https://frontend-9aivuawfr-ethernalllc-funds-projects.vercel.app"

      # ── Base de datos 
      - key: DATABASE_URL
        sync: false

      # ── Redis 
      - key: REDIS_URL
        fromService:
          name: ethernal-redis
          type: redis
          property: connectionString

      # ── Chains activas 
      - key: ACTIVE_CHAINS
        value: "11155111,421614"

      - key: SALE_RPC_URL
        sync: false                    # ← Setear en Render Dashboard
      - key: SALE_CONTRACT_ADDRESS
        sync: false                    # ← Setear en Render Dashboard
      - key: VESTING_CONTRACT_ADDRESS
        sync: false                    # ← Setear en Render Dashboard
      - key: SALE_CHAIN_ID
        value: "11155111"

      - key: RPC_URL
        sync: false
      - key: CHAIN_ID
        value: "421614"

      # Contratos del protocolo
      - key: PERSONALFUNDFACTORY_ADDRESS
        sync: false
      - key: PROTOCOLREGISTRY_ADDRESS
        sync: false
      - key: TREASURY_ADDRESS
        sync: false
      - key: USDC_ADDRESS
        sync: false

      # ── Auth 
      - key: ADMIN_WALLET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: NONCE_TTL_SECONDS
        value: "300"

      # ── Faucet 
      - key: FAUCET_PRIVATE_KEY
        sync: false
      - key: FAUCET_AMOUNT
        value: "10000"
      - key: FAUCET_COOLDOWN_HOURS
        value: "24"

      # ── Rate limiting 
      - key: RATE_LIMIT_ENABLED
        value: "true"

      # ── Sentry 
      - key: SENTRY_ENABLED
        value: "false"
      - key: SENTRY_DSN
        value: ""